name: Test & Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npx vitest run --coverage

      - name: Check coverage threshold
        run: |
          COV=$(node -p "require('./coverage/coverage-summary.json').total.statements.pct")
          echo "Statements coverage: $COV%"
          if (( $(echo "$COV < 48" | bc -l) )); then
            echo "::error::Coverage $COV% below 48% threshold"
            exit 1
          fi
